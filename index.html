    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

<body>

    <nav class="navbar navbar-dark bg-dark mb-3">
        <div class="container-fluid">
            <ul class="navbar-nav w-100 flex-row justify-content-between ">
            <li class="nav-item">

            </li>

    <main>
        <h1>Study Planner</h1>
    
        <form id="add-form">
            <input type="text" id="task-input" placeholder="What do you need to study?" required class="form-control">
            <select id="priority-input" class="form-control">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
            </select>
            <button type="submit" class="btn btn-dark" >Add to do</button>
         </form>
 
  <!-- Search -->
  <input type="text" id="search-input" placeholder="Search tasks..." class="form-control">
 
  <!-- Empty containers filled by JavaScript -->
  <div id="message"></div>
  <div id="stats"></div>
  <div id="board"></div>

    </main>

</body>
